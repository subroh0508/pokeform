# pokeapi-names — PokeAPI の全件名（ja/en）で名前 SoT languages を満たす自動取得 PR
#
# 目的: PokeAPI の list endpoint で全 species / items / moves / abilities / types を列挙し `names`（ja-Hrkt + en）を、
#       `pokemon-form` から mega（`is_mega` の form の `form_names`）を取得 → 名前 SoT YAML（data/languages・mega 含む
#       6 種）へ append/既存尊重で転記、generate + verify を通したうえで `data:names` ラベルの languages 更新 PR を
#       自動作成する。languages を reg 非依存の全件名辞書にする決定は ADR 0041（ADR 0035 の id 集合一致不変条件を
#       refine）、mega 名を PokeAPI(pokemon-form form_names) へ一本化する決定は ADR 0043。
# トリガー: `workflow_dispatch` 手動のみ（cron なし）。showdown-sync.yml / serebii-bulletin.yml と同型。全件列挙
#       のため regulation 入力は持たない（名前は reg 非依存）。メガストーン item 名など PokeAPI 非存在の手作業カバー
#       箇所は PR body の Serebii Champions リンク 5 本で目視差分チェックする（author-static-data skill 手順 3）。
name: pokeapi-names

on:
  workflow_dispatch: {}

# create-pull-request が branch push + PR open するため最小権限を明示付与する（[[redaction]]）。
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pokeapi-names
  cancel-in-progress: true

jobs:
  names:
    name: PokeAPI 全件名取得 → 転記 → verify → PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pokeform
        uses: actions/checkout@v6

      # Node 版の SoT は .node-version（ADR 0008）。pnpm は corepack を使わず直接入れる（ADR 0005）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install pokeform deps
        run: pnpm install --frozen-lockfile

      # 全件列挙で languages に未記録 / ja・en 欠落の id を PokeAPI `names`（ja/en）で埋める（差分・冪等）。
      # fetch は raw キャッシュへ best-effort 取得（404 skip）、sync は raw → languages/*.yaml へ append/既存尊重転記。
      - name: Fetch and sync PokeAPI names
        run: |
          pnpm fetch:ja-names
          pnpm sync:ja-names

      # スタイル lint（flow 禁止）→ 生成（generate:data・raw 非依存・superset 許容）→ 緑ゲート（verify）。
      - name: Style, generate, verify
        run: |
          pnpm check:yaml-style
          pnpm generate:data
          pnpm verify

      # 差分があれば data:names ラベルの languages 更新 PR を自動作成する。
      # 本文の件数 / workflow run は redaction 不要の公開メタ（PokeAPI public data・[[redaction]]）。
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/pokeapi-names-${{ github.run_id }}
          base: main
          labels: data:names
          commit-message: "data(languages): PokeAPI 全件名（ja/en）を languages へ同期"
          title: "data(languages): PokeAPI 全件名同期（names）"
          body: |
            PokeAPI の全件名（ja/en）を名前 SoT `data/languages/*.yaml`（mega 含む 6 種）へ同期した PR です（ADR 0041 / 0043）。

            - **dataset**: species / items / moves / abilities / types / **mega**（全件列挙・reg 非依存の全件名辞書）
            - **取得元**: PokeAPI `names`（ja = ja-Hrkt 優先 / en）。**mega は `pokemon-form` の `form_names`**（`is_mega`
              で判別・ADR 0043）。append/既存尊重で既存の en（showdown 正 / Serebii 速報）は上書きしない。
            - **検証**: `check:yaml-style` → `generate:data` → `pnpm verify` を通過
            - **workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### 手作業カバー箇所の差分チェック（Serebii Champions）

            PokeAPI に無い Champions 固有の名前（**メガストーン item 名**等）は本 PR で埋まりません。下記 Serebii
            ページで目視照合し、抜け / 誤りがあれば該当 languages ファイルへ手作業で追加してください（author-static-data
            skill 手順 3）:

            - 持ち物・メガストーン: https://www.serebii.net/pokemonchampions/items.shtml
            - 技: https://www.serebii.net/pokemonchampions/moves.shtml
            - 種族・メガ: https://www.serebii.net/pokemonchampions/pokemon.shtml
            - メガ特性: https://www.serebii.net/pokemonchampions/megaabilities.shtml
            - 新特性: https://www.serebii.net/pokemonchampions/newabilities.shtml

            > 名前の取得元分担は [[data-pipeline]] を参照。全件データ投入は author-static-data skill がドライブする。
